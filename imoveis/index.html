<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imóveis | Matildes Reis</title><link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header"><h1><span class="site-name">MATILDES REIS</span></h1><p>Imóveis para alugar</p></header>
<main class="container"><section class="hero"><h2>Encontre seu próximo lar</h2><p>Confira os imóveis disponíveis para locação.</p></section>
<section id="imoveis-lista" class="cards"></section>
</main>
<footer class="site-footer"><a href="../">Início</a><a href="../engenharia/">Engenharia Ambiental</a><a href="../transportes/">Transportes & Mobilidade</a><a href="../presentes/">Presentes</a><a href="../imoveis/">Imóveis</a></footer>
<script src="../js/conteudo.js"></script>
<script>
const lista=document.getElementById('imoveis-lista');
lista.innerHTML=IMOVEIS.map(i=>`<article class="card property-card"><div class="property-photo">${i.foto?`<img src="${i.foto}" alt="${i.titulo}">`:''}</div><div class="card-content"><h3>${i.titulo}</h3><p><strong>${i.quartos} quartos</strong> · ${i.andar}</p><p class="price">${i.preco}</p><a class="button" href="${i.linkQuintoAndar||whatsappLink('Olá! Tenho interesse em um imóvel para alugar.')}" target="_blank">ALUGUE AGORA</a></div></article>`).join('');
</script>
</body></html>
